<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>itemlog · 이동 중</title><style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#2b2b2b;background:#fffaf3}a{color:#e8743b}</style></head>
<body><p id="m">제품 페이지로 이동 중…</p>
<script>
const slug=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
if(slug==='links'){location.replace('/links.html');}
fetch('/links.json',{cache:'no-store'}).then(r=>r.json()).then(L=>{
  const it=L[slug];
  if(it){location.replace(it.url);}
  else{document.getElementById('m').innerHTML='찾는 제품이 없어요. <a href="/links.html">전체 제품 목록</a>에서 찾아 주세요.';}
}).catch(()=>{document.getElementById('m').innerHTML='<a href="/links.html">전체 제품 목록</a>';});
</script></body></html>
