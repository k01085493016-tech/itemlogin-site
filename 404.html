<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>아이템로그 · 이동 중</title><style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#2b2b2b;background:#fffaf3}a{color:#e8743b}</style></head>
<body><p id="m">이동 중…</p>
<script>
const slug=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
const home=()=>location.replace('/');
fetch('/links.json',{cache:'no-store'}).then(r=>r.json()).then(L=>{
  const it=L[slug];
  if(it){location.replace(it.url);}else{home();}
}).catch(home);
</script><noscript><a href="/">홈으로 가기</a></noscript></body></html>
