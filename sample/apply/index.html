<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>신청 페이지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ar:224,187,112;--gold3:#b88a3b;--gold4:#f0d28a;--tb1:#3a2a08;--tb2:#6b4a12;--n0:#070a1c;--n1:#0d1233;--n2:#161d4a;--gold:#e0bb70;--gold2:#fff1c9;--txt:#ece8f7;--sub:#a5a6c8;--line:rgba(var(--ar),.28);--ok:#37d6a0}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:'Noto Sans KR',sans-serif;background:var(--n0);color:var(--txt);line-height:1.8;font-size:16.5px;word-break:keep-all;overflow-wrap:break-word;overflow-x:clip}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
main{position:relative;z-index:2;max-width:520px;margin:0 auto;background:linear-gradient(180deg,rgba(7,10,28,.82),rgba(13,18,51,.9));box-shadow:0 0 80px rgba(0,0,0,.6);min-height:100vh}
h1,h2,h3,.serif{font-family:'Noto Serif KR',serif;line-height:1.45}
.gold{background:linear-gradient(100deg,var(--gold3),var(--gold2) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
section{padding:56px 22px;position:relative}
.eyebrow{display:block;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.3em;margin-bottom:10px}
h2{font-size:26px;font-weight:900;margin-bottom:10px}
.lead{color:var(--sub);font-size:15.5px}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
/* top banner */
.skip{position:absolute;left:-999px;top:0;background:#fff;color:#000;padding:8px 14px;z-index:99}.skip:focus{left:8px;top:8px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,var(--tb1),var(--tb2),var(--tb1));color:var(--gold2);text-align:center;font-size:13.5px;padding:9px 12px;display:none;backdrop-filter:blur(6px)}
.topbar b{font-family:'Noto Serif KR';letter-spacing:.04em}
/* hero */
.hero{padding:70px 22px 46px;text-align:center;overflow:hidden}
.cosmos{position:relative;width:210px;height:210px;margin:0 auto 26px}
.moon{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffaf0,var(--gold4) 55%,var(--gold3));box-shadow:0 0 50px 12px rgba(var(--ar),.4),0 0 110px 34px rgba(var(--ar),.16);animation:br 7s ease-in-out infinite}
.moon::after{content:"";position:absolute;left:24%;top:-8%;width:100%;height:100%;border-radius:50%;background:#0f1538}
@keyframes br{50%{box-shadow:0 0 70px 20px rgba(var(--ar),.5),0 0 130px 44px rgba(var(--ar),.2)}}
.ring{position:absolute;inset:0;animation:sp 60s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ring svg{width:100%;height:100%}
.el{position:absolute;width:17%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:'Noto Serif KR';font-weight:900;font-size:15px;color:#0b0e26;background:var(--c);box-shadow:0 0 16px var(--c);transform:translate(-50%,-50%)}
.el span{animation:sp 60s linear infinite reverse}
.hero .tag{display:inline-block;border:1px solid var(--line);color:var(--gold);padding:4px 14px;border-radius:999px;font-size:12px;letter-spacing:.14em;margin-bottom:18px}
.hero h1{font-size:34px;font-weight:900;margin-bottom:14px}
.hero h1 span{display:block;opacity:0;transform:translateY(18px);animation:up .9s forwards}
.hero h1 span:nth-child(2){animation-delay:.2s}
@keyframes up{to{opacity:1;transform:none}}
.hero p{color:var(--sub)}
/* count */
.countbox{display:none;margin:22px auto 0;max-width:360px;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:rgba(var(--ar),.06);font-size:14px}
.countbox b{color:var(--gold2);font-family:'Noto Serif KR';font-size:19px}
.timer{display:none;margin:18px auto 0;max-width:360px}
.timer .t{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.timer .t div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center}
.timer .t b{display:block;font-family:'Noto Serif KR';font-size:24px;color:var(--gold2);line-height:1.2}
.timer .t span{font-size:11px;color:var(--sub)}
.timer small{display:block;text-align:center;color:var(--sub);font-size:12px;margin-bottom:8px}
/* worries */
.wr{display:grid;gap:12px;margin-top:22px}
.w{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;text-align:left;background:rgba(22,29,74,.55);border:1px solid var(--line);border-radius:18px;padding:16px;color:var(--txt);font:inherit;cursor:pointer;transition:.3s;width:100%}
.w:hover,.w.on{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 12px 30px rgba(var(--ar),.12)}
.w .ic{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a3480,#0b0f2c);border:1px solid var(--gold);display:grid;place-items:center;font-family:'Noto Serif KR';font-size:22px;font-weight:900;color:var(--gold2)}
.w b{display:block;font-family:'Noto Serif KR';font-size:18px}
.w span{color:var(--sub);font-size:14px;display:block;line-height:1.55}
.w.on::after{content:"선택됨 · 신청서에 담깁니다";display:block;color:var(--ok);font-size:12px;margin-top:4px}
/* process */
.pr{margin-top:22px;display:grid;gap:0}
.pr div{display:grid;grid-template-columns:44px 1fr;gap:14px;padding-bottom:20px;position:relative}
.pr div::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:1px;background:repeating-linear-gradient(var(--gold) 0 4px,transparent 4px 9px);opacity:.5}
.pr div:last-child::before{display:none}
.pr i{font-style:normal;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:'Noto Serif KR';font-weight:900;color:var(--gold2);background:var(--n1)}
.pr b{display:block}
.pr span{color:var(--sub);font-size:14.5px}
/* products */
.pd{display:grid;gap:14px;margin-top:22px}
.p{position:relative;border-radius:20px;padding:2px;background:linear-gradient(160deg,rgba(var(--ar),.5),rgba(var(--ar),.08) 40%,rgba(var(--ar),.35))}
.p.hot{background:linear-gradient(160deg,var(--gold4),var(--gold3) 50%,var(--gold4));box-shadow:0 14px 40px rgba(var(--ar),.22)}
.p .in{border-radius:18px;background:linear-gradient(170deg,#141b46,#0a0e2a);padding:22px 20px;overflow:hidden;position:relative}
.rb{position:absolute;right:-34px;top:16px;background:var(--gold);color:#1a1530;font-size:11px;font-weight:700;padding:3px 40px;transform:rotate(38deg)}
.p h3{font-size:19px}
.p .d{color:var(--sub);font-size:14px}
.p .pc{font-family:'Noto Serif KR';font-weight:900;font-size:32px;color:var(--gold2);margin:8px 0}
.p .pc s{font-size:15px;font-weight:400;color:#7f81a8;margin-right:8px}
.p .pc small{font-size:14px;font-weight:400;color:var(--sub)}
.p ul{list-style:none;font-size:14.5px}
.p li{padding:4px 0 4px 20px;position:relative;border-top:1px solid rgba(255,255,255,.06)}
.p li::before{content:"◈";position:absolute;left:0;color:var(--gold);font-size:11px;top:8px}
/* report/faq/reviews */
.rv{display:grid;gap:12px;margin-top:20px}
.rv div{background:rgba(22,29,74,.55);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.rv .h{display:flex;justify-content:space-between;color:var(--sub);font-size:12.5px;margin-bottom:6px}
.rv .st{color:var(--gold)}
details{background:rgba(13,18,51,.8);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:10px}
details[open]{border-color:var(--gold)}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::after{content:"＋";color:var(--gold)}
details[open] summary::after{content:"－"}
details p{margin-top:8px;color:var(--sub);font-size:15px}
.refund{margin-top:20px;border:1.5px solid var(--gold);border-radius:14px;padding:16px 18px;background:linear-gradient(160deg,rgba(var(--ar),.1),transparent);font-size:14.5px}
.refund b{font-family:'Noto Serif KR';color:var(--gold2)}
/* form */
.form{background:rgba(22,29,74,.6);border:1px solid var(--line);border-radius:22px;padding:24px 20px;margin-top:20px}
.form label.l{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
.form label.l i{color:#ff7a7a;font-style:normal}
.seg{display:flex;gap:8px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:12px;border:1.5px solid rgba(255,255,255,.2);border-radius:12px;cursor:pointer;transition:.2s}
.seg input:checked+span{background:var(--gold);border-color:var(--gold);color:#1a1530;font-weight:700}
.f{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff}
.f:focus{outline:0;border-color:var(--gold)}
select.f option{color:#111}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row .fix{flex:0 0 auto;color:var(--sub)}
.hint{font-size:12.5px;color:var(--sub);margin-top:6px}
.comp{display:none;margin-top:16px;padding:16px;border:1px dashed rgba(var(--ar),.5);border-radius:14px}
.comp.on{display:block}
.addc{width:100%;margin-top:16px;padding:13px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;color:var(--gold);font:700 15px 'Noto Sans KR';cursor:pointer}
.agree{margin-top:18px;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px}
.agree label{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.agree p{display:none;font-size:12.5px;color:var(--sub);margin-top:8px}
.agree.o p{display:block}
.agree button{background:none;border:0;color:var(--gold);font:12.5px 'Noto Sans KR';cursor:pointer;margin-top:6px}
.payb{margin-top:20px;border:1px solid var(--line);border-radius:16px;padding:14px 12px;background:rgba(255,255,255,.96);color:#111;display:none}
.payb.on{display:block}
.payb .ptitle{font-weight:700;color:#111;margin:2px 6px 8px;font-size:15px}
.testbadge{display:none;margin:16px 0 0;padding:9px 12px;border-radius:10px;background:#fff4d6;color:#6b4a00;font-size:13px;font-weight:700}
.testbadge.on{display:block}
.paynote{font-size:12.5px;color:var(--sub);margin-top:10px}
.pdone{display:none;text-align:center;padding:30px 10px}
.pdone b.t{font-family:'Noto Serif KR',serif;font-size:22px;color:var(--gold2);display:block;margin-bottom:8px}
.pdone .rows{max-width:340px;margin:14px auto;text-align:left;font-size:14.5px}
.pdone .rows div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.18)}
.pdone a{color:var(--gold)}
.go{width:100%;margin-top:20px;padding:17px;border-radius:14px;border:0;background:linear-gradient(120deg,#c9a052,var(--gold2),#c9a052);background-size:200% 100%;color:#1a1530;font:900 18px 'Noto Sans KR';cursor:pointer;box-shadow:0 10px 30px rgba(var(--ar),.3);transition:.4s}
.go:hover{background-position:100% 0}
.go:disabled{opacity:.6}
.err{color:#ff8a8a;font-size:13px;margin-top:6px;display:none}
.done{display:none;text-align:center;padding:30px 10px}
.done b{font-family:'Noto Serif KR';font-size:22px;color:var(--gold2);display:block;margin-bottom:8px}
/* biz */
footer{padding:34px 22px 120px;font-size:12px;color:#7f81a8;line-height:1.7;border-top:1px solid rgba(var(--ar),.14)}
.fab{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(90px);z-index:45;border:0;padding:15px 30px;border-radius:999px;background:linear-gradient(120deg,#c9a052,var(--gold2));color:#1a1530;font:900 17px 'Noto Sans KR';box-shadow:0 12px 34px rgba(0,0,0,.5),0 0 0 0 rgba(var(--ar),.6);cursor:pointer;transition:transform .5s;animation:pl 2.4s infinite}
.fab.on{transform:translateX(-50%)}
@keyframes pl{70%{box-shadow:0 12px 34px rgba(0,0,0,.5),0 0 0 16px rgba(var(--ar),0)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:#fff;color:#111;padding:12px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:.4s;z-index:100;font-weight:700;font-size:14px;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal,.hero h1 span{opacity:1;transform:none}}
#app:empty::before{content:"불러오는 중...";display:block;text-align:center;padding:40vh 0;color:rgba(255,255,255,.55);font-size:14px;letter-spacing:.05em}
.heroimg{display:block;width:100%;max-width:360px;max-height:300px;object-fit:cover;border-radius:22px;margin:0 auto 26px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.hero.noart{padding-top:56px}
.sajuonly{display:block}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main id="app"></main>
<button class="fab" id="fab">신청서 작성하기</button>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
// 관리자 시트(구글 시트)의 내용을 불러와 config.js 기본값 위에 덮어씁니다. 못 불러오면 마지막으로 성공한 값, 그것도 없으면 config.js 값으로 뜹니다.
function __esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function __merge(base,over){const o=Array.isArray(base)?base.slice():Object.assign({},base);
 Object.keys(over).forEach(k=>{const v=over[k];
  if(v&&typeof v==='object'&&!Array.isArray(v)&&base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))o[k]=__merge(base[k],v);else o[k]=v});return o}
function __prep(cfg){const c=Object.assign({},cfg);
 if(typeof c.banner==='string'){const i=c.banner.indexOf(' · ');c.banner=c.banner?(i>0?'<b>'+__esc(c.banner.slice(0,i))+'</b> · '+__esc(c.banner.slice(i+3)):'<b>'+__esc(c.banner)+'</b>'):''}
 return c}
async function __loadCfg(C0){
 if(!C0.endpoint||C0.remote===false)return C0;
 const key='cfg:'+(C0.slug||'x');
 try{const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),5000);
  const r=await fetch(C0.endpoint+'?mode=config&_='+Date.now(),{signal:ctl.signal});clearTimeout(t);
  const j=await r.json();
  if(j&&j.ok&&j.cfg){try{localStorage.setItem(key,JSON.stringify(j.cfg))}catch(e){}return __merge(C0,__prep(j.cfg))}}catch(e){}
 try{const c=JSON.parse(localStorage.getItem(key)||'null');if(c)return __merge(C0,__prep(c))}catch(e){}
 return C0}
</script>
<script>
async function __boot(){
const C=await __loadCfg(window.CONFIG);
const THEMES={'민트':{'--gold':'#6fe3c1','--gold2':'#d9fff2','--gold3':'#2a9d7f','--gold4':'#9cf0d8','--ar':'111,227,193','--tb1':'#0b3a30','--tb2':'#14705a'},'코랄':{'--gold':'#ff9d84','--gold2':'#ffe3da','--gold3':'#d4583a','--gold4':'#ffc1b0','--ar':'255,157,132','--tb1':'#4a1a10','--tb2':'#8a3a24'},'하늘색':{'--gold':'#7db8ff','--gold2':'#e0efff','--gold3':'#3c78c8','--gold4':'#b4d6ff','--ar':'125,184,255','--tb1':'#0e2a52','--tb2':'#1d4f94'}};
if(THEMES[C.theme])Object.entries(THEMES[C.theme]).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
document.title=C.pageTitle||C.brand;
const DL=C.deadline?new Date(C.deadline).getTime():null,EXPIRED=DL!==null&&Date.now()>=DL;
[['og:title',C.pageTitle||C.brand],['og:description',(C.hero&&C.hero.sub)||''],['og:type','website']].forEach(([p,v])=>{const m=document.createElement('meta');m.setAttribute('property',p);m.content=v;document.head.appendChild(m)});
const md=document.createElement('meta');md.name='description';md.content=(C.hero&&C.hero.sub)||'';document.head.appendChild(md);
const sijin=[['unknown','모름 / 선택 안함'],['자시','자시 (子時) 23:30~01:29'],['축시','축시 (丑時) 01:30~03:29'],['인시','인시 (寅時) 03:30~05:29'],['묘시','묘시 (卯時) 05:30~07:29'],['진시','진시 (辰時) 07:30~09:29'],['사시','사시 (巳時) 09:30~11:29'],['오시','오시 (午時) 11:30~13:29'],['미시','미시 (未時) 13:30~15:29'],['신시','신시 (申時) 15:30~17:29'],['유시','유시 (酉時) 17:30~19:29'],['술시','술시 (戌時) 19:30~21:29'],['해시','해시 (亥時) 21:30~23:29']];
const yr=new Date().getFullYear();
const opt=(a,ph)=>`<option value="">${ph}</option>`+a.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('');
const years=Array.from({length:yr-1926},(_,i)=>[yr-i,(yr-i)+'년']),months=Array.from({length:12},(_,i)=>[i+1,(i+1)+'월']),days=Array.from({length:31},(_,i)=>[i+1,(i+1)+'일']);
const birth=(p)=>`<div class="row"><select class="f" name="${p}y" ${p?'':'required'}>${opt(years,'년도')}</select><select class="f" name="${p}m" ${p?'':'required'}>${opt(months,'월')}</select><select class="f" name="${p}d" ${p?'':'required'}>${opt(days,'일')}</select></div>
<div class="seg" style="margin-top:8px"><label><input type="radio" name="${p}cal" value="양력" checked><span>양력</span></label><label><input type="radio" name="${p}cal" value="음력"><span>음력</span></label><label><input type="radio" name="${p}cal" value="윤달"><span>윤달</span></label></div>
<label class="l">태어난 시간 <i>*</i></label><select class="f" name="${p}time" ${p?'':'required'}>${opt(sijin,'시간 선택')}</select>`;
const comp=`<div class="comp" id="comp"><b class="serif" style="color:var(--gold2)">동반자 정보</b>
<label class="l">이름 <i>*</i></label><input class="f" name="c_name" placeholder="이름">
<label class="l">성별</label><div class="seg"><label><input type="radio" name="c_sex" value="남성" checked><span>남성</span></label><label><input type="radio" name="c_sex" value="여성"><span>여성</span></label></div>
<label class="l">생년월일 <i>*</i></label>${birth('c_')}</div>`;
const tz=(s)=>String(s).padStart(2,'0');

// render
// 마감이 지나면 쿠폰가 대신 평소 가격을 보여 줍니다 (끝난 할인가를 광고하지 않기 위함)
const prods=(C.products||[]).map(p=>EXPIRED?Object.assign({},p,{price:p.priceAfter||p.listPrice||p.price,listPrice:null,ribbon:'',bullets:(p.bullets||[]).filter(b=>!/쿠폰/.test(b))}):p);
const GEN=!!(C.form&&C.form.mode==='general');
const FIELDS=GEN?((C.form&&C.form.fields)||[]):[];
const CUSTOM=FIELDS.map((fd,i)=>{const r=fd.required?' required':'';const n='name="x'+i+'"';const ph=fd.placeholder?' placeholder="'+esc(fd.placeholder)+'"':'';let ctl;
 if(fd.type==='textarea')ctl='<textarea class="f" '+n+' rows="3"'+ph+r+'></textarea>';
 else if(fd.type==='select')ctl='<select class="f" '+n+r+'><option value="">선택해 주십시오</option>'+(fd.options||[]).map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>';
 else if(fd.type==='date')ctl='<input class="f" type="date" '+n+r+'>';
 else if(fd.type==='number')ctl='<input class="f" type="number" inputmode="numeric" '+n+ph+r+'>';
 else ctl='<input class="f" '+n+ph+r+'>';
